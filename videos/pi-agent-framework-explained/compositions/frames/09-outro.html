            ((p[0] + q[0]) / 2).toFixed(1) +
            " " +
            ((p[1] + q[1]) / 2).toFixed(1);
        }
        return d;
      }

      /* ---- setup: geometry that must exist before measuring ---------------- */
      document
        .getElementById("o9-under-p")
        .setAttribute("d", hwMarkPath(460, 34, 5));
      document
        .getElementById("o9-mag-lens")
        .setAttribute("d", hwWobbleEllipse(40, 40, 24, 24, 3, 3.5));

      var tl = gsap.timeline({ paused: true });
      /* master spacer — the shot is exactly 13.803s */
      tl.to({ v: 0 }, { v: 1, duration: DUR, ease: "none" }, 0);

      /* ---- svg-path-draw helper (measured, never guessed) ------------------ */
      function drawOn(el, at, dur, ease) {
        var len = el.getTotalLength() * 1.02;
        gsap.set(el, { strokeDasharray: len, strokeDashoffset: len, opacity: 0 });
        tl.set(el, { opacity: 1 }, at);
        tl.to(el, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out" }, at);
      }

      /* ======================================================================
         Scene 1 (0.0–3.5s) — 厚壳越摞越高 vs 一笔小 π
         ====================================================================== */

      /* ornament wreath settles in quietly */
      var ornEls = gsap.utils.toArray("#o9-orn .o9-orn");
      ornEls.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0 },
          { opacity: 0.4, duration: 0.5, ease: "power2.out" },
          0.25 + i * 0.15
        );
      });

      /* left: stack of thick-shell notes piles up (staggered 叠高) */
      var notes = gsap.utils.toArray("#o9-dl .o9-note-w");
      notes.forEach(function (el, i) {
        tl.fromTo(
          el,
          { scale: 0.55, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.8)" },
          0.35 + i * 0.28
        );
      });
      drawOn(document.getElementById("o9-arw-p"), 1.55, 0.45);
      tl.fromTo(
        "#o9-cap-l",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        1.9
      );

      /* right: a tiny pi, one unbroken pen stroke */
      drawOn(document.getElementById("o9-pi-s"), 1.75, 0.78);
      tl.fromTo(
        "#o9-cap-r",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        2.5
      );

      /* doodles step back as the hero arrives (de-emphasis, not an exit) */
      tl.to(
        ["#o9-dl", "#o9-arw", "#o9-cap-l", "#o9-dr", "#o9-cap-r"],
        { opacity: 0.3, duration: 0.55, ease: "power2.inOut" },
        3.75
      );

      /* ======================================================================
         Scene 2 (3.5–7.3s) — 中央大 π 真笔迹 write-on 收笔 + 两行副标
         ====================================================================== */

      /* hw-write-title trace choreography: per-stroke pen-velocity reveals,
         60ms pen lifts, duration proportional to ink time */
      function penTrace(paths, at, totalDur) {
        var lift = 0.06;
        var metas = [];
        var inkSum = 0;
        paths.forEach(function (p) {
          var pe = hwPenEase(p);
          var len = p.getTotalLength();
          metas.push({ pe: pe, len: len, st: { p: 0 } });
          inkSum += pe.inkTime;
          p.setAttribute("stroke-dasharray", len + " " + len);
          p.setAttribute("stroke-dashoffset", String(len));
          p.style.opacity = "0";
        });
        var drawTotal = Math.max(0.1, totalDur - lift * (paths.length - 1));
        var t = at;
        metas.forEach(function (m) {
          var d = (m.pe.inkTime / inkSum) * drawTotal;
          m.d = d;
          tl.to(m.st, { p: 1, duration: d, ease: m.pe.ease }, t);
          t += d + lift;
        });
        hwOnUpdate(tl, function () {
          for (var i = 0; i < metas.length; i++) {
            var m = metas[i];
            paths[i].style.strokeDashoffset = m.len * (1 - m.st.p);
            paths[i].style.opacity = m.st.p > 0 ? "1" : "0";
          }
        });
        return t - lift;
      }
      penTrace(
        [
          document.getElementById("o9-pi-a"),
          document.getElementById("o9-pi-b"),
          document.getElementById("o9-pi-c"),
        ],
        3.85,
        2.4
      );

      /* two sub-lines land per-word (per-char), on the voice */
      function landChars(lineEl, text, at) {
        var wrap = lineEl.querySelector(".o9-subb");
        var spans = [];
        for (var i = 0; i < text.length; i++) {
          var s = document.createElement("span");
          s.className = "o9-ch";
          s.textContent = text.charAt(i);
          wrap.appendChild(s);
          spans.push(s);
        }
        spans.forEach(function (s, i) {
          tl.fromTo(
            s,
            { opacity: 0, y: 26, rotation: hwHash(i * 3 + 1, 31) * 4 },
            { opacity: 1, y: 0, rotation: 0, duration: 0.42, ease: "back.out(1.6)" },
            at + i * 0.085
          );
        });
      }
      landChars(document.getElementById("o9-sub1"), "内核读得完", 4.35);
      landChars(document.getElementById("o9-sub2"), "零件换得动", 5.75);

      /* coral squiggle underline seals the lockup */
      drawOn(document.getElementById("o9-under-p"), 6.55, 0.7, "power2.inOut");

      /* ======================================================================
         Scene 3 (7.3–10.8s) — mono 地址 type-on with caret
         ====================================================================== */

      tl.fromTo(
        "#o9-card-w",
        { scale: 0.88, opacity: 0, y: 18 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" },
        7.35
      );
      tl.fromTo(
        "#o9-gh",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.out" },
        7.6
      );
      /* magnifier doodle: lens then handle, staggered ~70% */
      drawOn(document.getElementById("o9-mag-lens"), 7.75, 0.38);
      drawOn(document.getElementById("o9-mag-handle"), 7.99, 0.22);

      /* discrete-text-sequence: whole-state replacement at time thresholds —
         keystroke clusters, pauses at the slashes, no per-char animation */
      var SEQ = [
        { t: 0, text: "" },
        { t: 8.1, text: "gith" },
        { t: 8.24, text: "github" },
        { t: 8.38, text: "github." },
        { t: 8.52, text: "github.com" },
        { t: 8.86, text: "github.com/" },
        { t: 9.12, text: "github.com/bad" },
        { t: 9.44, text: "github.com/badlogic" },
        { t: 9.78, text: "github.com/badlogic/" },
        { t: 9.96, text: "github.com/badlogic/pi" },
        { t: 10.1, text: "github.com/badlogic/pi-" },
        { t: 10.26, text: "github.com/badlogic/pi-mono" },
      ];
      function textAt(time) {
        for (var i = SEQ.length - 1; i >= 0; i--) {
          if (time >= SEQ[i].t) return SEQ[i].text;
        }
        return "";
      }
      var urlEl = document.getElementById("o9-url");
      var caretEl = document.getElementById("o9-caret");
      var BLINK0 = 7.95, BLINK1 = 10.6, CYCLE = 0.55; /* 有限拍数 blink */
      hwOnUpdate(tl, function () {
        var t = tl.time();
        urlEl.textContent = textAt(t);
        var on = 0;
        if (t >= BLINK0 && t <= BLINK1) {
          on = Math.sin(((t - BLINK0) / CYCLE) * Math.PI * 2) > 0 ? 1 : 0;
        }
        caretEl.style.opacity = on ? "1" : "0";
      });

      /* completion pulse (two chained tweens — no repeat/yoyo) */
      gsap.set("#o9-url-w", { transformOrigin: "0% 50%" });
      tl.to("#o9-url-w", { scale: 1.04, duration: 0.18, ease: "power2.out" }, 10.45);
      tl.to("#o9-url-w", { scale: 1, duration: 0.22, ease: "power2.inOut" }, 10.63);

      /* ======================================================================
         Scene 4 (10.8–13.8s) — coral stamp 落定, then stillness (boil only)
         ====================================================================== */
      tl.fromTo(
        "#o9-stamp-w",
        { scale: 1.9, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.32, ease: "power3.in" },
        11.15
      );
      tl.to("#o9-stamp-w", { scale: 0.94, duration: 0.1, ease: "power2.out" }, 11.47);
      tl.to("#o9-stamp-w", { scale: 1.04, duration: 0.12, ease: "power2.inOut" }, 11.57);
      tl.to("#o9-stamp-w", { scale: 1, duration: 0.16, ease: "power2.out" }, 11.69);

      /* ---- boils: the hand-drawn life, seek-safe through one dispatcher ---- */
      hwBoil(tl, "#o9-markb", { amp: 1.6, rot: 0.5, frameDrop: 3, seed: 7 });
      hwBoil(tl, gsap.utils.toArray("#o9-dl .o9-note-b"), {
        amp: 1.8,
        rot: 0.8,
        frameDrop: 3,
        seed: 11,
      });
      hwBoil(tl, "#o9-rboil", { amp: 1.6, rot: 0.6, frameDrop: 3, seed: 13 });
      hwBoil(tl, "#o9-arwb", { amp: 1.4, rot: 0.5, frameDrop: 3, seed: 15 });
      hwBoil(tl, "#o9-magb", { amp: 1.4, rot: 0.5, frameDrop: 3, seed: 17 });
      hwBoil(tl, gsap.utils.toArray("#o9-orn .o9-ornb"), {
        amp: 1.1,
        rot: 0.35,
        frameDrop: 3,
        seed: 19,
      });
      hwBoil(tl, gsap.utils.toArray(".o9-subb"), { amp: 0.8, rot: 0.25, frameDrop: 3, seed: 21 });

      window.__timelines[ID] = tl;
    })();
  </script>
</template>
