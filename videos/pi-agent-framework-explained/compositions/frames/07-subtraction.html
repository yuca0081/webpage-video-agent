              qq = pts[(j + 1) % N];

              " Q" +
              p[0].toFixed(1) +
              " " +
              p[1].toFixed(1) +
              " " +
              ((p[0] + qq[0]) / 2).toFixed(1) +

              (by2 + 2).toFixed(1);
