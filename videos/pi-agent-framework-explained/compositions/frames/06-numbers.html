        );

        // center-outward expansion: cluster at row center, stagger to slots on VO word order
        var cards = gsap.utils.toArray(".n6-card");
        for (var ci = 0; ci < cards.length; ci++) {
          tl.fromTo(
            cards[ci],
            { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.55, opacity: 0 },
            {
              x: Number(cards[ci].getAttribute("data-target-x")),
              scale: 1,
              opacity: 1,
              duration: 0.55,
              ease: "power3.out",
            },
            3.15 + ci * 0.34
          );
        }

        /* ================= Scene 3 (5.1-8.8) — token counter rolls 0 -> 999 -> "<1000" ================= */
        tl.fromTo(
          "#n6-rlabel",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
          5.2
        );
        tl.fromTo("#n6-roll-wrap", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 5.6);
        var rollEl = id("n6-roll");
        var rollState = { v: 0 };
        tl.to(
          rollState,
          {
            v: 999,
            duration: 1.7,
            ease: "power3.out",
            onUpdate: function () {
              rollEl.textContent = String(Math.round(rollState.v));
            },
          },
          5.6
        );
        // value-scaled counter: digits + scale share timing and ease
        tl.fromTo(
          ".n6-roll-scale",
          { scale: 0.62 },
          { scale: 1, duration: 1.7, ease: "power3.out" },
          5.6
        );

        // within-scene swap: rolling digits cut to the "<1000" lockup (z-pop + opacity)
        tl.to("#n6-roll-wrap", { opacity: 0, duration: 0.12, ease: "power1.in" }, 7.3);
        tl.fromTo(
          "#n6-lock",
          { opacity: 0, scale: 1.32 },
          { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" },
          7.36
        );
        // the "<" gets its own beat after the count lands
        tl.fromTo(
          "#n6-lt",
          { opacity: 0, x: -44, rotation: -12 },
          { opacity: 1, x: 0, rotation: 0, duration: 0.34, ease: "back.out(2.1)" },
          7.7
        );
        tl.fromTo(
          "#n6-token",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          7.5
        );

        /* ================= Scene 4 (8.8-12.82) — the weekly-report note + coral circle ================= */
        tl.fromTo(
          "#n6-note",
          { opacity: 0, y: -84, rotation: -8 },
          { opacity: 1, y: 0, rotation: -3.5, duration: 0.75, ease: "back.out(1.2)" },
          8.95
        );
        tl.fromTo(
          "#n6-pill",
          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2)" },
          9.8
        );

        // coral callout (hw-callout-circle pattern): wobbled ellipse draw -> connector -> label pop + squash
        id("n6-co-outline").setAttribute("d", wobbleEllipse(1048, 380, 880, 274, 5, 4, -90));
        id("n6-co-conn").setAttribute("d", "M 1048 652 Q 1028 688 1071 706");
        drawOn(id("n6-co-outline"), 9.75, 0.8);
        drawOn(id("n6-co-conn"), 10.52, 0.26);

        var pop = id("n6-co-pop");
        var deform = id("n6-co-deform");
        gsap.set(pop, { scale: 0.001, opacity: 0, transformOrigin: "1071px 706px" });
        gsap.set(deform, { transformOrigin: "50% 100%" });
        tl.to(pop, { opacity: 1, duration: 0.08, ease: "none" }, 10.78);
        tl.to(
          pop,
          { scale: 1, duration: 0.3, ease: "power2.in", immediateRender: false },
          10.78
        );
        // volume-preserving contact squash on the drawn shapes at label arrival
        var st = { s: 0 };
        onRender(function () {
          var along = 1 - st.s;
          gsap.set(deform, { scaleY: along, scaleX: 1 / along });
        });
        tl.to(st, { s: 0.075, duration: 2 / 30, ease: "power3.out" }, 11.08);
        var spring = springSnappy();
        tl.to(st, { s: 0, duration: spring.duration, ease: spring.ease }, 11.08 + 3 / 30);

        /* ---- the boil layer: hand-drawn life, pure function of time (breather included) ---- */
        boil(".n6-lc", { amp: 1.5, rot: 0.5, seed: 3 });
        boil(".n6-rc", { amp: 1.5, rot: 0.5, seed: 4 });
        boil(".n6-orn", { amp: 1.4, rot: 0.6, seed: 7 });
        boil(".n6-four-boil", { amp: 1.1, rot: 0.35, seed: 9 });
        boil(".n6-roll-boil", { amp: 1.0, rot: 0.3, seed: 12 });
        boil(".n6-lock-boil", { amp: 0.9, rot: 0.3, seed: 13 });
        boil("#n6-note-boil", { amp: 0.7, rot: 0.3, seed: 11 });
        boil("#n6-co-boil", { amp: 1.6, rot: 0.5, seed: 5 });

        window.__timelines["06-numbers"] = tl;
      })();
    </script>
  </div>
</template>
