        /* stamp double border */
        document.getElementById("f05-stamp-o").setAttribute("d", wobbleRect(250, 130, 18, 13, 3));
        document.getElementById("f05-stamp-i").setAttribute("d", wobbleRect(222, 102, 12, 14, 3));

        /* ================= build: ornament wreath ================= */
        var bgSvg = document.getElementById("f05-orn-svg");
        function ornGroup(id) {
          var g = mk("g", { id: id });
          bgSvg.appendChild(g);
          return g;
        }
        /* daisy, top-left, cropping the corner */
        var daisyG = ornGroup("f05-orn-daisy");
        var daisyPaths = [];
        for (var pi = 0; pi < 8; pi++) {
          var pg = mk(
            "g",
            { transform: "rotate(" + (pi * 45 + hash(pi, 31) * 4).toFixed(1) + " 95 95)" },
            daisyG
          );
          var petal = mk(
            "path",
            { class: "f05-fill-butter", "fill-opacity": "0", d: wobbleEllipse(95, 59, 13, 30, 40 + pi, 6) },
            pg
          );
          daisyPaths.push(petal);
        }
        var daisyCore = mk(
          "path",
          { class: "f05-fill-peach", "fill-opacity": "0", d: wobbleEllipse(95, 95, 15, 15, 55, 5) },
          daisyG
        );
        daisyPaths.push(daisyCore);
        /* star, top-right */
        function starPath(cx, cy, R, seed) {
          var d = "";
          for (var i = 0; i < 10; i++) {
            var a = -Math.PI / 2 + (i * Math.PI) / 5;
            var rad = (i % 2 === 0 ? R : R * 0.45) * (1 + hash(i * 7 + 3, seed) * 0.07);
            d +=
              (i ? " L " : "M ") +
              (cx + Math.cos(a) * rad).toFixed(1) +
              " " +
              (cy + Math.sin(a) * rad).toFixed(1);
          }
          return d + " Z";
        }
        var starG = ornGroup("f05-orn-star");
        var starPathEl = mk("path", { d: starPath(1835, 82, 40, 33) }, starG);
        /* cloud, right edge */
        function cloudPath(cx, cy, w, seed) {
          function j(n) {
            return hash(n, seed) * 4;
          }
          var h = w * 0.42,
            x0 = cx - w / 2,
            x1 = cx + w / 2,
            yb = cy + h * 0.25;
          return (
            "M " + (x0 + j(1)).toFixed(1) + " " + (yb + j(2)).toFixed(1) +
            " Q " + (x0 + w * 0.22 + j(3)).toFixed(1) + " " + (cy - h * 0.95 + j(4)).toFixed(1) +
            " " + (x0 + w * 0.42 + j(5)).toFixed(1) + " " + (cy - h * 0.35 + j(6)).toFixed(1) +
            " Q " + (cx + j(7)).toFixed(1) + " " + (cy - h * 1.25 + j(8)).toFixed(1) +
            " " + (x0 + w * 0.72 + j(9)).toFixed(1) + " " + (cy - h * 0.45 + j(10)).toFixed(1) +
            " Q " + (x1 - w * 0.06 + j(11)).toFixed(1) + " " + (cy - h * 0.8 + j(12)).toFixed(1) +
            " " + (x1 + j(13)).toFixed(1) + " " + (yb + j(14)).toFixed(1) +
            " Z"
          );
        }
        var cloudG = ornGroup("f05-orn-cloud");
        var cloudPathEl = mk("path", { d: cloudPath(1795, 300, 150, 36) }, cloudG);
        /* sun, bottom-left */
        var sunG = ornGroup("f05-orn-sun");
        var sunCircle = mk(
          "path",
          { class: "f05-fill-peach", "fill-opacity": "0", d: wobbleEllipse(95, 800, 30, 30, 60, 5) },
          sunG
        );
        var rays = "";
        for (var ri = 0; ri < 8; ri++) {
          var ra = (ri * Math.PI) / 4 + hash(ri, 61) * 0.1;
          var rx1 = 95 + Math.cos(ra) * 40,
            ry1 = 800 + Math.sin(ra) * 40;
          var rl = 18 + hash(ri + 9, 61) * 5;
          rays +=
            " M " +
            rx1.toFixed(1) +
            " " +
            ry1.toFixed(1) +
            " l " +
            (Math.cos(ra) * rl).toFixed(1) +
            " " +
            (Math.sin(ra) * rl).toFixed(1);
        }
        var sunRays = mk("path", { d: rays }, sunG);
        /* small butter star, bottom-center */
        var star2G = ornGroup("f05-orn-star2");
        var star2El = mk(
          "path",
          { class: "f05-fill-butter", "fill-opacity": "0", d: starPath(1125, 838, 24, 34) },
          star2G
        );

        /* ================= timeline ================= */
        /* macro move: one slow push under the whole shot */
        gsap.set("#f05-stage", { transformOrigin: "50% 45%" });
        tl.to("#f05-stage", { scale: 1.032, duration: DUR, ease: "none" }, 0);

        /* Scene 1 (0.0-2.8s) — badge, the two nodes draw on, first arc */
        gsap.set("#f05-badge", { rotation: -1.5 });
        tl.fromTo(
          "#f05-badge",
          { scale: 0.5, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" },
          0.12
        );
        function boxOn(boxSel, at) {
          var path = document.querySelector(boxSel + " path.f05-bx-rect");
          drawOn(path, at, 0.75);
          tl.to(path, { attr: { "fill-opacity": 1 }, duration: 0.3, ease: "power1.inOut" }, at + 0.5);
          tl.fromTo(
            boxSel + " .f05-bx-label",
            { opacity: 0 },
            { opacity: 1, duration: 0.35, ease: "power2.out" },
            at + 0.5
          );
        }
        boxOn("#f05-box-model", 0.38);
        boxOn("#f05-box-tool", 1.12);
        drawOn(arr1, 1.95, 0.7);

        /* ornaments draw on quietly in the background */
        function ornIn(paths, at, gap, dur) {
          paths.forEach(function (p, i) {
            drawOn(p, at + i * gap, dur);
            if (p.getAttribute("fill-opacity") === "0") {
              tl.to(p, { attr: { "fill-opacity": 1 }, duration: 0.25 }, at + i * gap + dur * 0.7);
            }
          });
        }
        ornIn(daisyPaths, 0.15, 0.05, 0.3);
        ornIn([starPathEl], 0.55, 0, 0.4);
        ornIn([cloudPathEl], 0.85, 0, 0.45);
        ornIn([sunCircle, sunRays], 1.15, 0.08, 0.35);
        ornIn([star2El], 1.45, 0, 0.3);

        /* Scene 2 (2.8-6.2s) — arcs 2 & 3, the token goes out and returns */
        drawOn(arr2, 2.95, 0.6);
        drawOn(arr3, 3.6, 1.05);

        var chip = document.getElementById("f05-chip");
        gsap.set(chip, { xPercent: -50, yPercent: -50 });
        var chipStart = topTravel.getPointAtLength(0);
        gsap.set(chip, { x: chipStart.x, y: chipStart.y });
        tl.fromTo(
          chip,
          { opacity: 0, scale: 0.6 },
          { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" },
          3.15
        );
        travel(topTravel, chip, 3.28, 0.94);
        travel(botTravel, chip, 4.48, 1.04);
        tl.to(chip, { backgroundColor: "#a8e6cf", duration: 0.25, ease: "power1.inOut" }, 4.26);
        tl.to(chip, { opacity: 0, scale: 0.7, duration: 0.25, ease: "power2.in" }, 5.5);

        function pulse(sel, at) {
          tl.to(sel, { scaleX: 1.07, scaleY: 0.9, duration: 0.1, ease: "power3.out" }, at);
          tl.to(sel, { scaleX: 1, scaleY: 1, duration: 0.45, ease: "back.out(2.5)" }, at + 0.11);
        }
        gsap.set("#f05-box-tool .f05-bx-deform", { transformOrigin: "50% 100%" });
        gsap.set("#f05-box-model .f05-bx-deform", { transformOrigin: "50% 100%" });
        pulse("#f05-box-tool .f05-bx-deform", 4.22);
        pulse("#f05-box-model .f05-bx-deform", 5.62);

        tl.fromTo(
          "#f05-note-w",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          4.98
        );

        /* Scene 3 (6.2-9.0s) — the loop keeps cycling, then the DONE stamp */
        var runner = document.getElementById("f05-runner");
        gsap.set(runner, { xPercent: -50, yPercent: -50 });
        var lapStart = lapPath.getPointAtLength(0);
        gsap.set(runner, { x: lapStart.x, y: lapStart.y });
        tl.fromTo(runner, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 6.3);
        travel(lapPath, runner, 6.38, 0.58, "power1.inOut");
        travel(lapPath, runner, 7.02, 0.5, "none");
        tl.to(runner, { opacity: 0, duration: 0.18, ease: "power1.in" }, 7.52);

        gsap.set("#f05-stamp", { rotation: -10, transformOrigin: "50% 50%" });
        gsap.set("#f05-stamp-deform", { transformOrigin: "50% 100%" });
        tl.fromTo(
          "#f05-stamp",
          { opacity: 0, scale: 2.4, y: -80 },
          { opacity: 1, scale: 1, y: 0, duration: 0.34, ease: "power3.in" },
          7.58
        );
        tl.to(
          "#f05-stamp-deform",
          { scaleX: 1.06, scaleY: 0.92, duration: 0.09, ease: "power3.out" },
          7.92
        );
        tl.to(
          "#f05-stamp-deform",
          { scaleX: 1, scaleY: 1, duration: 0.5, ease: "back.out(2.4)" },
          8.01
        );
        drawOn(ripple, 7.92, 0.32, "power2.out");
        tl.to(ripple, { opacity: 0, duration: 0.28, ease: "power1.in" }, 8.4);

        /* Scene 4 (9.0-12.5s) — the event receipt prints and checks off */
        gsap.set("#f05-receipt", { transformOrigin: "50% 35%" });
        tl.fromTo(
          "#f05-receipt",
          { opacity: 0, y: 48, scale: 0.93, rotation: -4 },
          { opacity: 1, y: 0, scale: 1, rotation: -1.2, duration: 0.55, ease: "back.out(1.6)" },
          9.12
        );
        tl.fromTo(
          "#f05-rc-cap-t",
          { opacity: 0 },
          { opacity: 1, duration: 0.35, ease: "power2.out" },
          9.45
        );
        tl.fromTo(
          "#f05-rc-cap-m",
          { opacity: 0 },
          { opacity: 0.75, duration: 0.35, ease: "power2.out" },
          9.55
        );
        gsap.set(".f05-rule", { scaleX: 0, transformOrigin: "0% 50%" });
        [
          ["#f05-row1", 9.92],
          ["#f05-row2", 10.82],
          ["#f05-row3", 11.72],
        ].forEach(function (r) {
          var el = r[0],
            at = r[1];
          tl.fromTo(
            el,
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
            at
          );
          tl.to(el + " .f05-rule", { scaleX: 1, duration: 0.3, ease: "power2.out" }, at + 0.1);
          tl.fromTo(
            el + " .f05-check path",
            { strokeDasharray: 100, strokeDashoffset: 100 },
            { strokeDashoffset: 0, duration: 0.38, ease: "power1.in" },
            at + 0.24
          );
        });
        gsap.utils.toArray("#f05-rc-dots i").forEach(function (d, i) {
          tl.fromTo(
            d,
            { opacity: 0, scale: 0.3 },
            { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" },
            12.18 + i * 0.12
          );
        });

        /* Scene 5 (12.5-15.08s) — the receipt lifts half a notch; quiet read */
        tl.to(
          "#f05-receipt",
          { y: -34, rotation: -2.2, duration: 0.95, ease: "power2.inOut" },
          12.6
        );

        /* boils — hand-drawn life on the loop, note, stamp, ornaments */
        boil(["#f05-arr-1-g", "#f05-arr-2-g", "#f05-arr-3-g"], { amp: 1.5, rot: 0.35, frameDrop: 3, seed: 6 });
        boil("#f05-box-model .f05-bx-boil", { amp: 1.6, rot: 0.5, frameDrop: 3, seed: 4 });
        boil("#f05-box-tool .f05-bx-boil", { amp: 1.6, rot: 0.5, frameDrop: 3, seed: 9 });
        boil("#f05-note", { amp: 1.3, rot: 0.5, frameDrop: 3, seed: 12, baseRot: -2 });
        boil("#f05-stamp-boil", { amp: 1.5, rot: 0.6, frameDrop: 3, seed: 13 });
        boil(
          ["#f05-orn-daisy", "#f05-orn-star", "#f05-orn-cloud", "#f05-orn-sun", "#f05-orn-star2"],
          { amp: 1.1, rot: 0.4, frameDrop: 4, seed: 21 }
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["05-loop"] = tl;
      })();
    </script>
  </div>
</template>
