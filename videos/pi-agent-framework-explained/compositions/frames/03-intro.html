      // curvature-adaptive pen-velocity ease (fast on straights, slow into curves)
      function penEase(pathEl) {
        var kCurve = 10;
        var L = pathEl.getTotalLength();
        if (L <= 0) return { ease: function (t) { return t; }, inkTime: 1, len: 0 };
        var PRE = 48;
        var pts = [];
        for (var i = 0; i <= PRE; i++) pts.push(pathEl.getPointAtLength((L * i) / PRE));
        var curv = [0];
        for (i = 1; i < PRE; i++) {
          var ax = pts[i].x - pts[i - 1].x, ay = pts[i].y - pts[i - 1].y;
          var bx = pts[i + 1].x - pts[i].x, by = pts[i + 1].y - pts[i].y;
          var la = Math.hypot(ax, ay) || 1e-6, lb = Math.hypot(bx, by) || 1e-6;
          var dot = Math.max(-1, Math.min(1, (ax * bx + ay * by) / (la * lb)));

        for (i = 0; i < curv.length; i++) mass += curv[i];

        var t = 0;

          var u = ((i - 0.5) / N) * PRE;
          var i0 = Math.floor(u), f = u - i0;

      var ornAt = [0.15, 0.4, 0.65, 0.9, 1.15, 1.35];
      var orns = document.querySelectorAll(".f03-orn");
      for (var j = 0; j < orns.length; j++) {
        tl.fromTo(
          orns[j],
          { opacity: 0 },
          { opacity: 0.55, duration: 0.8, ease: "power2.out" },
          ornAt[j]
        );
      }
      boil(tl, ".f03-orn-boil", { amp: 1.3, rot: 0.6, seed: 9 });

      /* ── Scene 2 (3.5–7s) · "起名 Pi" — heavy π write-on + handwritten Pi ── */
      // svg-path-draw: measured dasharray, power2.out strokes, ~75% stagger
      var piStrokes = document.querySelectorAll("#f03-glyph-svg path");
      var piAt = [3.55, 3.99, 4.41];
      var piDur = [0.6, 0.55, 0.5];
      for (var k = 0; k < piStrokes.length; k++) {
        var plen = piStrokes[k].getTotalLength() * 1.02;
        piStrokes[k].style.strokeDasharray = plen + " " + plen;
        piStrokes[k].style.strokeDashoffset = plen;
        tl.to(
          piStrokes[k],
          { strokeDashoffset: 0, duration: piDur[k], ease: "power2.out" },
          piAt[k]
        );
      }
      // "Pi" follows beside, true baked-glyph write-on
      var table = window.__hwPenCaveat;
      var nsvg = document.getElementById("f03-name-svg");
      var built = buildWord(nsvg, "Pi", INK);
      var scalePx = 150 / 1000;
      var wU = built.widthUnits;
      var hU = table.meta.ascent - table.meta.descent;
      nsvg.setAttribute("width", Math.ceil(wU * scalePx));
      nsvg.setAttribute("height", Math.ceil(hU * scalePx));
      nsvg.setAttribute("viewBox", "0 " + -table.meta.ascent + " " + wU + " " + hU);
      var nameEnd = writeOnTrace(tl, built, 5.05);
      // smooth settle, no overshoot
      tl.fromTo(
        "#f03-lock-move",
        { scale: 1.035 },
        { scale: 1, duration: 0.55, ease: "power2.inOut" },
        Math.min(nameEnd + 0.12, 7.0)
      );
      boil(tl, "#f03-lock-boil", { amp: 1.5, rot: 0.45, seed: 8 });

      /* ── Scene 3 (7–10.6s) · "TypeScript 开源 agent" — sticky labels pop in ── */
      tl.fromTo(
        "#f03-note-a",
        { x: 430, opacity: 0, rotation: -10 },
        { x: 0, opacity: 1, rotation: -3, duration: 0.62, ease: "back.out(1.7)" },
        7.15
      );
      tl.fromTo(
        "#f03-note-b",
        { x: 430, opacity: 0, rotation: 10 },
        { x: 0, opacity: 1, rotation: 2.5, duration: 0.62, ease: "back.out(1.7)" },
        7.7
      );

      /* ── Scene 4 (10.6–14.27s) · coined principle lands, coral squiggle ── */
      var chars = document.querySelectorAll(".f03-cw");
      for (var c = 0; c < chars.length; c++) {
        tl.fromTo(
          chars[c],
          { y: -46, opacity: 0, rotation: hsh(c * 13 + 5, 7) * 5 },
          { y: 0, opacity: 1, rotation: 0, duration: 0.42, ease: "back.out(1.3)" },
          10.78 + c * 0.15
        );
      }
      var markPath = document.querySelector("#f03-claim-mark path");
      markPath.setAttribute("d", squiggle(640, 26, 5));
      var mlen = markPath.getTotalLength() * 1.02;
      gsap.set(markPath, { strokeDasharray: mlen, strokeDashoffset: mlen });
      tl.to(markPath, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 12.5);
      boil(tl, "#f03-mark-boil", { amp: 1.4, rot: 0.35, seed: 5 });

      /* 静止读 — everything holds still from ~13.2s to the end; the root
         transition owns the exit (this is not the final frame). */
      window.__timelines["03-intro"] = tl;
    })();
  </script>
