        for (var i = 0; i < N; i++) {
          var a = (i / N) * Math.PI * 2;
          var wr = 1 + window.hwHash(i * 13 + 5, seed) * (wobblePct / 100);
          pts.push([cx + Math.cos(a) * rx * wr, cy + Math.sin(a) * ry * wr]);
        }
        var mx = (pts[0][0] + pts[N - 1][0]) / 2,
          my = (pts[0][1] + pts[N - 1][1]) / 2;
        var d = "M" + mx.toFixed(1) + " " + my.toFixed(1);
        for (var j = 0; j < N; j++) {
          var p = pts[j],
            q = pts[(j + 1) % N];
          d +=
            " Q" +
            p[0].toFixed(1) +
            " " +
            p[1].toFixed(1) +
            " " +
            ((p[0] + q[0]) / 2).toFixed(1) +
            " " +
            ((p[1] + q[1]) / 2).toFixed(1);
        }
        return d;
      };
      /* hw-underline mark path — "strike" = the double-pass strikethrough */
      window.hwMarkPath = function (w, h, style, seed) {
        seed = seed || 1;
        function wob(n, range) {
          return window.hwHash(n, seed) * (range === undefined ? 5 : range);
        }
        var mid = h / 2;
        if (style === "strike") {
          return (
            "M " +
            (2 + wob(1, 3)) +
            " " +
            (mid + wob(2)) +
            " L " +
            (w - 4 + wob(3, 3)) +
            " " +
            (mid - 3 + wob(4)) +
            " M " +
            (w - 10 + wob(5, 4)) +
            " " +
            (mid + 7 + wob(6)) +
            " L " +
            (8 + wob(7, 4)) +
            " " +
            (mid + 3 + wob(8))
          );
        }
        var segs = Math.max(5, Math.round(w / 95));
        var d = "M 2 " + (mid + wob(0, 4));
        for (var i = 1; i <= segs; i++) {
          var x = (w / segs) * i;
          d +=
            " Q " +
            (x - w / segs / 2 + wob(i * 4 + 1, 9)) +
            " " +
            (mid + (i % 2 ? -1 : 1) * (9 + wob(i * 4 + 2, 4))) +
            " " +
            x.toFixed(1) +
            " " +
            (mid + wob(i * 4 + 3, 4));
        }
        return d;
      };
      /* spring registers (from hw-box-label) — the factory owns the duration */
      var LN1000 = Math.log(1000);
      window.springEase = function (opts) {
        var zeta = opts.zeta,
          response = opts.response;
        var w0 = (2 * Math.PI) / response;
        var T = LN1000 / (zeta * w0);
        var x;
        if (zeta < 1) {
          var wd = w0 * Math.sqrt(1 - zeta * zeta);
          x = function (t) {
            return (
              1 -
              Math.exp(-zeta * w0 * t) *
                (Math.cos(wd * t) + ((zeta * w0) / wd) * Math.sin(wd * t))
            );
          };
        } else {
          x = function (t) {
            return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
          };
        }
        var xT = x(T);
        return {
          ease: function (p) {
            return p >= 1 ? 1 : x(p * T) / xT;
          },
          duration: T,
        };
      };
      /* hw-callout-circle scribble hatch (verbatim geometry) */
      function scribblePath(cx, cy, rx, ry, seed) {
        var d = "",
          rows = 11;
        for (var i = 0; i < rows; i++) {
          var t = (i + 0.5) / rows;
          var yy = cy - ry + t * ry * 2;
          var half = Math.sqrt(Math.max(0.05, 1 - Math.pow((yy - cy) / ry, 2)));
          var xw = rx * half * 0.86;
          var xa = cx - xw + window.hwHash(i * 7 + 2, seed) * 8;
          var xb = cx + xw + window.hwHash(i * 7 + 3, seed) * 8;
          d += (i === 0 ? "M " : " L ") + (i % 2 ? xa : xb).toFixed(1) + " " + yy.toFixed(1);
          d +=
            " L " +
            (i % 2 ? xb : xa).toFixed(1) +
            " " +
            (yy + window.hwHash(i * 7 + 4, seed) * 4).toFixed(1);
        }
        return d;
      }

      /* svg-path-draw: measured length, never guessed; pens don't bounce.
         visOpacity restores an authored resting opacity (the scribble hatch). */
      function drawPath(tl, path, at, dur, ease, visOpacity) {
        var len = path.getTotalLength();
        path.style.strokeDasharray = len + " " + len;
        path.style.strokeDashoffset = String(len);
        gsap.set(path, { opacity: 0 }); // kill the round-cap nub pre-draw
        tl.set(path, { opacity: visOpacity === undefined ? 1 : visOpacity }, at);
        tl.to(path, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out" }, at);
      }

      /* ---- wobble geometry (deterministic, seeded) ---- */
      byId("f02-fig-head").setAttribute("d", window.hwWobbleEllipse(845, 398, 48, 44, 7, 3));
      byId("f02-fig-head").setAttribute("class", "");
      byId("f02-fig-head").style.fill = "none";
      byId("f02-fig-head").style.stroke = "#2d2d2d";
      byId("f02-fig-head").style.strokeWidth = "7";
      byId("f02-fig-head").style.strokeLinecap = "round";
      byId("f02-screen").setAttribute("d", window.hwWobbleRect(245, 178, 14, 19, 3));
      byId("f02-screen").style.fill = "#FFFFFF";
      byId("f02-screen").style.fillOpacity = "0";
      byId("f02-strike").querySelector("path").setAttribute("d", window.hwMarkPath(252, 36, "strike", 6));
      byId("f02-co-outline").setAttribute("d", window.hwWobbleEllipse(170, 131, 143, 94, 21, 4));
      byId("f02-co-scribble").setAttribute("d", scribblePath(170, 131, 143, 94, 22));

      var crowdEls = Array.prototype.slice.call(document.querySelectorAll(".f02-ci"));
      var LAYER = {
        "f02-c-butter": 1,
        "f02-c-peach": 1,
        "f02-c-gear": 0.84,
        "f02-c-gouzi": 0.84,
        "f02-c-ctx": 1,
        "f02-c-bug": 1,
        "f02-c-zhuRu": 1.15,
        "f02-c-bolt": 1.15,
      };
      crowdEls.forEach(function (el, i) {
        var w = el.offsetWidth,
          h = el.offsetHeight;
        var seed = parseInt(el.dataset.seed, 10);
        var face = el.querySelector(".f02-face");
        if (el.dataset.kind === "badge") {
          face.setAttribute("d", window.hwWobbleEllipse(w / 2, h / 2, w / 2 - 10, h / 2 - 10, seed, 3));
        } else {
          face.setAttribute("d", window.hwWobbleRect(w, h, 16, seed, 2.8));
        }
        el.dataset.restScale = String(LAYER[el.id] || 1);
        /* bake the centering so tweened x/y stay pure offsets (recipe law) */
        gsap.set(el, { xPercent: -50, yPercent: -50 });
      });

      var sheetEls = Array.prototype.slice.call(document.querySelectorAll(".f02-sheet"));
      sheetEls.forEach(function (el) {
        var i = parseInt(el.dataset.i, 10);
        var w = el.offsetWidth;
        el.querySelector(".f02-sheet-face").setAttribute(
          "d",
          window.hwWobbleRect(w, 46, 8, 91 + i, 2.2)
        );
        var w1 = 150 + Math.round((window.hwHash(i * 3 + 1, 95) + 1) * 55);
        var w2 = 90 + Math.round((window.hwHash(i * 3 + 2, 95) + 1) * 40);
        el.querySelector(".f02-ll").setAttribute(
          "d",
          "M 26 14 L " + (26 + w1) + " 14 M 26 26 L " + (26 + w2) + " 26 M 26 38 L " +
            (26 + Math.round(w1 * 0.6)) + " 38"
        );
      });

      var tl = gsap.timeline({ paused: true });

      /* ================ Scene 1 (0.0–2.9s) — desk + laptop + figure draw on;
         "越做越厚" — the two big flanks pop in from left / right ================ */
      tl.fromTo(
        ".f02-doodles",
        { opacity: 0 },
        { opacity: 0.32, duration: 0.9, ease: "power1.out" },
        0.05
      );
      drawPath(tl, byId("f02-desk-top"), 0.08, 0.3);
      drawPath(tl, byId("f02-desk-legl"), 0.32, 0.3);
      drawPath(tl, byId("f02-desk-legr"), 0.4, 0.3);
      drawPath(tl, byId("f02-screen"), 0.45, 0.55);
      drawPath(tl, byId("f02-lap-b1"), 0.95, 0.25);
      drawPath(tl, byId("f02-lap-b2"), 1.02, 0.25);
      drawPath(tl, byId("f02-lap-b3"), 1.1, 0.3);
      tl.to(byId("f02-screen"), { fillOpacity: 1, duration: 0.3, ease: "power1.out" }, 1.18);
      drawPath(tl, byId("f02-fig-head"), 0.5, 0.45);
      drawPath(tl, byId("f02-fig-body"), 0.95, 0.4);
      drawPath(tl, byId("f02-fig-armr"), 1.18, 0.35);
      drawPath(tl, byId("f02-fig-arml"), 1.28, 0.35);
      drawPath(tl, byId("f02-fig-legl"), 1.46, 0.35);
      drawPath(tl, byId("f02-fig-legr"), 1.56, 0.35);
      gsap.set([".f02-dot", "#f02-fig-mouth"], { opacity: 0 });
      tl.to([".f02-dot", "#f02-fig-mouth"], { opacity: 1, duration: 0.3, ease: "power1.out" }, 1.74);

      /* flanks: smooth spring-pop (one mild settle), sliding in from the sides */
      var flankPop = window.springEase({ zeta: 0.72, response: 0.34 });
      [["f02-c-butter", 2.02], ["f02-c-peach", 2.24]].forEach(function (pair) {
        var el = byId(pair[0]);
        tl.fromTo(
          el,
          {
            x: parseFloat(el.dataset.sx),
            y: parseFloat(el.dataset.sy),
            scale: 0.5,
            opacity: 0,
            rotation: parseFloat(el.dataset.rot) - 12,
          },
          {
            x: parseFloat(el.dataset.tx),
            y: parseFloat(el.dataset.ty),
            scale: 1,
            opacity: 1,
            rotation: parseFloat(el.dataset.rot),
            duration: flankPop.duration,
            ease: flankPop.ease,
          },
          pair[1]
        );
      });

      /* ================ Scene 2 (2.9–6.7s) — "偷偷塞上下文" sticky rain.
         center-outward-expansion REVERSED: every item carries its resting
         offset from stage center (data-tx/ty) and flies INWARD from an outer
         start (data-sx/sy) — pure x/y offsets over the baked -50% centering,
         out-easing only. Density rises: gaps shrink 0.55 → 0.33. ================ */
      var rain = [
        ["f02-c-gear", 3.2],
        ["f02-c-gouzi", 3.75],
        ["f02-c-ctx", 4.25],
        ["f02-c-bug", 4.68],
        ["f02-c-zhuRu", 5.05],
        ["f02-c-bolt", 5.38],
      ];
      rain.forEach(function (pair) {
        var el = byId(pair[0]);
        var sc = parseFloat(el.dataset.restScale);
        tl.fromTo(
          el,
          {
            x: parseFloat(el.dataset.sx),
            y: parseFloat(el.dataset.sy),
            scale: sc * 0.55,
            opacity: 0,
            rotation: parseFloat(el.dataset.rot) - 10,
          },
          {
            x: parseFloat(el.dataset.tx),
            y: parseFloat(el.dataset.ty),
            scale: sc,
            opacity: 1,
            rotation: parseFloat(el.dataset.rot),
            duration: 0.66,
            ease: "power3.out",
          },
          pair[1]
        );
      });

      /* ================ Scene 3 (6.7–9.8s) — prompt v1 struck, v2 written
         (silence …); then the log pile rises from the bottom ================ */
      tl.fromTo(
        "#f02-pc",
        { y: 30, opacity: 0, scale: 0.94, rotation: -2 },
        { y: 0, opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "power3.out" },
        6.78
      );
      tl.fromTo(
        "#f02-sd1",
        { attr: { r: 0 }, opacity: 0 },
        { attr: { r: 5 }, opacity: 1, duration: 0.28, ease: "power2.out" },
        7.5
      );
      tl.fromTo(
        "#f02-sd2",
        { attr: { r: 0 }, opacity: 0 },
        { attr: { r: 6 }, opacity: 1, duration: 0.28, ease: "power2.out" },
        7.66
      );
      tl.fromTo(
        "#f02-sd3",
        { attr: { r: 0 }, opacity: 0 },
        { attr: { r: 7 }, opacity: 1, duration: 0.28, ease: "power2.out" },
        7.82
      );
      /* hw-underline "strike": the double strikethrough draws on */
      drawPath(tl, byId("f02-strike").querySelector("path"), 7.38, 0.5, "power2.inOut");
      tl.fromTo(
        "#f02-v2",
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        7.98
      );
      /* log pile: sheets slide up inside the clipped wrapper, bottom sheet first */
      sheetEls.forEach(function (el, i) {
        gsap.set(el, { y: 250 });
        tl.fromTo(
          el,
          { y: 250 },
          { y: 0, duration: 0.38, ease: "power2.out", immediateRender: false },
          8.35 + i * 0.36
        );
      });

      /* ================ Scene 4 (9.8–13.31s) — everything shoves one notch
         toward the stage center (velocity-matched: identical duration + ease,
         displacement ∝ each item's offset — one beat, camera static);
         the screen blacks out, 「黑盒」 lands, coral marker circles it hard ================ */
      var SHOVE_AT = 9.92,
        SHOVE_DUR = 0.3,
        SHOVE_EASE = "power3.out";
      crowdEls.forEach(function (el) {
        var tx = parseFloat(el.dataset.tx),
          ty = parseFloat(el.dataset.ty);
        tl.fromTo(
          el,
          { x: tx, y: ty },
          {
            x: tx - tx * 0.09,
            y: ty - ty * 0.09,
            duration: SHOVE_DUR,
            ease: SHOVE_EASE,
            immediateRender: false,
          },
          SHOVE_AT
        );
      });
      tl.fromTo(
        "#f02-pc",
        { x: 0, y: 0 },
        { x: 55, y: -17, duration: SHOVE_DUR, ease: SHOVE_EASE, immediateRender: false },
        SHOVE_AT
      );
      tl.fromTo(
        "#f02-pile",
        { x: 0, y: 0 },
        { x: -55, y: -20, duration: SHOVE_DUR, ease: SHOVE_EASE, immediateRender: false },
        SHOVE_AT
      );

      tl.to(byId("f02-screen"), { fill: "#2D2D2D", duration: 0.5, ease: "power1.out" }, 10.08);
      gsap.set(".f02-hz", { transformOrigin: "50% 60%" });
      tl.fromTo(
        "#f02-hz1",
        { scale: 0.3, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        10.42
      );
      tl.fromTo(
        "#f02-hz2",
        { scale: 0.3, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        10.56
      );

      /* hw-callout-circle (connector/label anatomy omitted): outline draws,
         then the scribble hatch sketches in behind it */
      drawPath(tl, byId("f02-co-outline"), 10.85, 0.6, "power2.inOut");
      drawPath(tl, byId("f02-co-scribble"), 11.42, 0.55, "power2.inOut", 0.4);

      /* ---- boils: everything hand-drawn stays alive; no exits (non-final frame) ---- */
      window.hwBoil(tl, "#f02-doodle-svg", { amp: 1, rot: 0.3, frameDrop: 4, seed: 32 });
      window.hwBoil(tl, ["#f02-s1svg", "#f02-laptop"], { amp: 1.1, rot: 0.3, frameDrop: 3, seed: 42 });
      window.hwBoil(tl, ".f02-ci-boil", { amp: 1.4, rot: 0.5, frameDrop: 3, seed: 62 });
      window.hwBoil(tl, "#f02-pc-boil", { amp: 1.3, rot: 0.4, frameDrop: 3, seed: 72 });
      window.hwBoil(tl, ".f02-sheet-boil", { amp: 1, rot: 0.3, frameDrop: 3, seed: 82 });
      window.hwBoil(tl, "#f02-co-boil", { amp: 1.2, rot: 0.4, frameDrop: 3, seed: 92 });

      /* tail pad: stretch the timeline to the full window so the boil keeps ticking */
      var filler = { v: 0 };
      tl.to(filler, { v: 1, duration: 0.02 }, 13.29);

      window.__timelines["02-pain"] = tl;
    })();
  </script>
